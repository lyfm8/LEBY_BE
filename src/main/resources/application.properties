spring.application.name=be
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT}

# ==========================================
# DATABASE CONFIGURATION (TiDB Cloud / MySQL 8)
# ==========================================

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=${DB_USE_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8&rewriteBatchedStatements=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway quản lý toàn bộ DDL; Hibernate chỉ kiểm chứng khớp 100% Entity
spring.jpa.hibernate.ddl-auto=validate

# ==========================================
# FLYWAY DATABASE MIGRATION CONFIGURATION
# ==========================================
# Đặt FLYWAY_ENABLED=true trong .env sau khi đã chuẩn hóa schema & reset DB sạch
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

# ==========================================
# JPA & HIBERNATE PERFORMANCE OPTIMIZATIONS
# ==========================================
# 1. Batch Fetching (Triệt tiêu N+1 Query: tự động gom nạp quan hệ Lazy theo mệnh đề IN)
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# 2. JDBC Batching (Gom nhiều câu INSERT/UPDATE thành 1 chuyến xe mạng duy nhất)
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.order_inserts=true

# ==========================================
# JWT CONFIGURATION
# ==========================================

# Access Token: tồn tại 2 tiếng. Dùng để xác thực mỗi request.
jwt.access.secret=${JWT_ACCESS_SECRET}
jwt.access.expiration-ms=7200000

# Refresh Token: tồn tại 1 năm. Dùng để lấy Access Token mới khi hết hạn.
jwt.refresh.secret=${JWT_REFRESH_SECRET}
jwt.refresh.expiration-ms=31536000000

# ==========================================
# COOKIE CONFIGURATION
# ==========================================

cookie.access-token-name=accessToken
cookie.refresh-token-name=refreshToken

# ==========================================
# MAIL CONFIGURATION (Gmail SMTP)
# ==========================================
# Cách lấy App Password: myaccount.google.com/apppasswords

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ==========================================
# CACHE CONFIGURATION (Redis - Distributed)
# ==========================================

spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=true

# ==========================================
# CLOUDINARY CONFIGURATION
# ==========================================

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
cloudinary.signature-expires-in=${CLOUDINARY_SIGNATURE_EXPIRES_IN:3600}

# ==========================================
# MULTIPART UPLOAD CONFIGURATION
# ==========================================

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
