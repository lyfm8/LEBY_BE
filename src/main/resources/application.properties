spring.application.name=be

# ==========================================
# DATABASE CONFIGURATION (MySQL Cloud - Aiven)
# ==========================================

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&requireSSL=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Auto-update database schema
spring.jpa.hibernate.ddl-auto=update

# ==========================================
# JWT CONFIGURATION
# ==========================================

# Access Token: tồn tại ngắn (15 phút). Dùng để xác thực mỗi request.
jwt.access.secret=${JWT_ACCESS_SECRET:my-super-secret-access-key-32chars-min}
jwt.access.expiration-ms=900000

# Refresh Token: tồn tại dài (7 ngày). Dùng để lấy Access Token mới khi hết hạn.
jwt.refresh.secret=${JWT_REFRESH_SECRET:my-super-secret-refresh-key-32chars-min}
jwt.refresh.expiration-ms=604800000

# ==========================================
# COOKIE CONFIGURATION
# ==========================================

cookie.access-token-name=accessToken
cookie.refresh-token-name=refreshToken

# ==========================================
# MAIL CONFIGURATION (Gmail SMTP)
# ==========================================
# Cách lấy App Password: myaccount.google.com/apppasswords

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ==========================================
# CACHE CONFIGURATION (Caffeine - In-Memory)
# ==========================================

spring.cache.type=caffeine
# OTP hết hạn sau 10 phút (600 giây).
spring.cache.caffeine.spec=expireAfterWrite=600s,maximumSize=1000