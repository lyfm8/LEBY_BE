spring.application.name=be
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT}

# ==========================================
# DATABASE CONFIGURATION (MySQL Cloud - Aiven)
# ==========================================

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&requireSSL=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Auto-update database schema
spring.jpa.hibernate.ddl-auto=update

# ==========================================
# JWT CONFIGURATION
# ==========================================

# Access Token: tồn tại 2 tiếng. Dùng để xác thực mỗi request.
jwt.access.secret=${JWT_ACCESS_SECRET}
jwt.access.expiration-ms=7200000

# Refresh Token: tồn tại 1 năm. Dùng để lấy Access Token mới khi hết hạn.
jwt.refresh.secret=${JWT_REFRESH_SECRET}
jwt.refresh.expiration-ms=31536000000

# ==========================================
# COOKIE CONFIGURATION
# ==========================================

cookie.access-token-name=accessToken
cookie.refresh-token-name=refreshToken

# ==========================================
# MAIL CONFIGURATION (Gmail SMTP)
# ==========================================
# Cách lấy App Password: myaccount.google.com/apppasswords

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ==========================================
# CACHE CONFIGURATION (Redis - Distributed)
# ==========================================

spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=true
